apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn-webhook
  labels:
    app.kubernetes.io/name: authn-webhook
    app.kubernetes.io/part-of: auth-provider-zitadel
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authn-webhook
      app.kubernetes.io/part-of: auth-provider-zitadel
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: authn-webhook
        app.kubernetes.io/part-of: auth-provider-zitadel
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authn-webhook
          image: ghcr.io/milo-os/zitadel-provider:latest
          imagePullPolicy: IfNotPresent
          args:
            - authn-webhook
            - --webhook-port=$(WEBHOOK_PORT)
            - --cert-dir=$(CERT_DIR)
            - --cert-file=$(CERT_FILE)
            - --key-file=$(KEY_FILE)
            - --zitadel-domain=$(ZITADEL_DOMAIN)
            - --zitadel-private-key=$(ZITADEL_PRIVATE_KEY_FILE_PATH)
            - --jwt-expiration=$(JWT_EXPIRATION)
            - --metrics-bind-address=$(METRICS_BIND_ADDRESS)
            - --client-ca-file=$(CLIENT_CA_FILE)
            - --mail-webhook-allowed-client-names=$(MAIL_WEBHOOK_ALLOWED_CLIENT_NAMES)
            - --email-verification-template=$(EMAIL_VERIFICATION_TEMPLATE)
            - --email-verification-allowed-origins=$(EMAIL_VERIFICATION_ALLOWED_ORIGINS)
            - --email-verification-expiry-minutes=$(EMAIL_VERIFICATION_EXPIRY_MINUTES)
            - --account-recovery-template=$(ACCOUNT_RECOVERY_TEMPLATE)
            - --account-recovery-allowed-origins=$(ACCOUNT_RECOVERY_ALLOWED_ORIGINS)
            - --account-recovery-expiry-minutes=$(ACCOUNT_RECOVERY_EXPIRY_MINUTES)
            - --account-recovery-cooldown=$(ACCOUNT_RECOVERY_COOLDOWN)
            - --account-recovery-max-per-hour=$(ACCOUNT_RECOVERY_MAX_PER_HOUR)
            - --notification-namespace=$(NOTIFICATION_NAMESPACE)
          env:
            - name: WEBHOOK_PORT
              value: "8090"
            - name: CERT_DIR
              value: certs
            - name: CERT_FILE
              value: tls.crt
            - name: KEY_FILE
              value: tls.key
            - name: ZITADEL_DOMAIN
              value: https://auth.datum.net
            - name: ZITADEL_PRIVATE_KEY_FILE_PATH
              value: /etc/zitadel/auth/machine-account-key.json
            - name: JWT_EXPIRATION
              value: "1h"
            - name: METRICS_BIND_ADDRESS
              value: ":8443"
            # Empty leaves the verification endpoint unregistered; an overlay opts in.
            - name: EMAIL_VERIFICATION_TEMPLATE
              value: ""
            - name: EMAIL_VERIFICATION_ALLOWED_ORIGINS
              value: ""
            # Must stay empty: any value turns on client-cert verification for the
            # whole webhook server, and nothing is mounted here to satisfy it.
            - name: CLIENT_CA_FILE
              value: ""
            # Which mTLS callers may reach the mail endpoints, by client certificate
            # CN and/or URI SAN. CLIENT_CA_FILE proves only that a caller holds a
            # cert this CA signed; where one CA issues to many workloads that is all
            # of them. Empty accepts any signed caller and logs a startup warning —
            # production sets this.
            - name: MAIL_WEBHOOK_ALLOWED_CLIENT_NAMES
              value: ""
            - name: EMAIL_VERIFICATION_EXPIRY_MINUTES
              value: "60"
            # Empty leaves the recovery endpoint unregistered; an overlay opts in.
            # Setting the template also makes CLIENT_CA_FILE mandatory: the binary
            # refuses to start without it rather than serve the endpoint unauthenticated.
            - name: ACCOUNT_RECOVERY_TEMPLATE
              value: ""
            - name: ACCOUNT_RECOVERY_ALLOWED_ORIGINS
              value: ""
            - name: ACCOUNT_RECOVERY_EXPIRY_MINUTES
              value: "60"
            # The per-user mail budget. Recovery is pre-authentication, so the
            # requester cannot be bound to the account: this and the origin
            # allowlist are the only controls that apply. "0" disables either half.
            - name: ACCOUNT_RECOVERY_COOLDOWN
              value: "2m"
            - name: ACCOUNT_RECOVERY_MAX_PER_HOUR
              value: "5"
            - name: NOTIFICATION_NAMESPACE
              value: milo-system
          ports:
            - containerPort: 8443
              name: metrics
              protocol: TCP
            - containerPort: 8090
              name: webhook
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          volumeMounts: []
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi

      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      volumes: []