apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  labels:
    app.kubernetes.io/name: auth-provider-zitadel
    app.kubernetes.io/component: apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-provider-zitadel
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-provider-zitadel
        app.kubernetes.io/component: apiserver
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apiserver
          image: ghcr.io/milo-os/zitadel-provider:latest
          args:
            - apiserver
            - --secure-port=8443
            - --tls-cert-file=$(TLS_CERT_FILE)
            - --tls-private-key-file=$(TLS_PRIVATE_KEY_FILE)
            - --requestheader-client-ca-file=$(REQUESTHEADER_CLIENT_CA_FILE)
            - --requestheader-allowed-names=$(REQUESTHEADER_ALLOWED_NAMES)
            - --requestheader-extra-headers-prefix=$(REQUESTHEADER_EXTRA_HEADERS_PREFIX)
            - --requestheader-group-headers=$(REQUESTHEADER_GROUP_HEADERS)
            - --requestheader-username-headers=$(REQUESTHEADER_USERNAME_HEADERS)
            - --requestheader-uid-headers=$(REQUESTHEADER_UID_HEADERS)
            - --zitadel-issuer=$(ZITADEL_ISSUER)
            - --zitadel-api=$(ZITADEL_API)
            - --zitadel-key=$(ZITADEL_MACHINE_ACCOUNT_KEY_PATH)
            - --zitadel-introspection-project-id=$(ZITADEL_INTROSPECTION_PROJECT_ID)
            - -v=4
            - --enable-impersonation-fallback=$(ENABLE_IMPERSONATION_FALLBACK)
            - --recovery-links-enabled=$(RECOVERY_LINKS_ENABLED)
            - --account-recovery-support-template=$(ACCOUNT_RECOVERY_SUPPORT_TEMPLATE)
            - --account-recovery-complete-url=$(ACCOUNT_RECOVERY_COMPLETE_URL)
            - --account-recovery-expiry-minutes=$(ACCOUNT_RECOVERY_EXPIRY_MINUTES)
            - --notification-namespace=$(NOTIFICATION_NAMESPACE)
          env:
            # The admin backstop's switch, owned by infra: while false the
            # PasskeyRegistrationLink create returns 503, so the milo role that
            # authorises it can ship dormant.
            - name: RECOVERY_LINKS_ENABLED
              value: "false"
            - name: ACCOUNT_RECOVERY_SUPPORT_TEMPLATE
              value: ""
            - name: ACCOUNT_RECOVERY_COMPLETE_URL
              value: ""
            - name: ACCOUNT_RECOVERY_EXPIRY_MINUTES
              value: "60"
            - name: NOTIFICATION_NAMESPACE
              value: milo-system
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: ZITADEL_ISSUER
              value: "https://zitadel.datum-cloud.com"
            - name: ZITADEL_API
              value: "zitadel.datum-cloud.com"
            - name: ZITADEL_MACHINE_ACCOUNT_KEY_PATH
              value: "/etc/zitadel/machine-account-key.json"
            - name: ZITADEL_INTROSPECTION_PROJECT_ID
              value: ""
            - name: TLS_CERT_FILE
              value: /etc/kubernetes/pki/client/tls.crt
            - name: TLS_PRIVATE_KEY_FILE
              value: /etc/kubernetes/pki/client/tls.key
            - name: REQUESTHEADER_CLIENT_CA_FILE
              value: "/etc/kubernetes/pki/trust/ca.crt"
            - name: REQUESTHEADER_ALLOWED_NAMES
              value: ""
            - name: REQUESTHEADER_EXTRA_HEADERS_PREFIX
              value: "X-Remote-Extra-"
            - name: REQUESTHEADER_USERNAME_HEADERS
              value: "X-Remote-User"
            - name: REQUESTHEADER_GROUP_HEADERS
              value: "X-Remote-Group"
            - name: REQUESTHEADER_UID_HEADERS
              value: "X-Remote-Uid"
            - name: ENABLE_IMPERSONATION_FALLBACK
              value: "false"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts: []
      volumes: []


