name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      
  pull_request:
    paths-ignore:
      - "README.md"

  release:
    types: [published]

jobs:

  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.21.0

  publish-container-image:
    needs: validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      registry-organization: milo-os
      image-name: zitadel-provider
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundles:
    needs: publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.21.0
    with:
      bundle-name: ghcr.io/milo-os/zitadel-provider-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/milo-os/zitadel-provider
      debug: true
    secrets: inherit
